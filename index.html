<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>整骨院 姿勢AI分析</title>
  
  <style>
    body { font-family: sans-serif; text-align: center; margin: 20px; background-color: #f0f2f5; }
    h1 { color: #333; font-size: 1.5rem; }
    #container { position: relative; width: 100%; max-width: 500px; margin: 0 auto; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    video, canvas { width: 100%; height: auto; display: block; }
    canvas { position: absolute; left: 0; top: 0; pointer-events: none; }
    #status { padding: 12px; background: #fff; margin-bottom: 15px; font-weight: bold; border-radius: 6px; border: 1px solid #ddd; }
  </style>
</head>
<body>

  <h1>姿勢推定（フロントエンド完結版）</h1>
  <div id="status">AIシステムを起動しています...</div>
  
  <div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <script type="module">
    // 最新のMediaPipeライブラリを読み込み
    import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8";

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("output_canvas");
    const ctx = canvas.getContext("2d");
    const statusDiv = document.getElementById("status");
    let poseLandmarker = undefined;

    async function initializeAI() {
      try {
        statusDiv.innerText = "設定ファイルをダウンロード中...";
        // Wasm（コアエンジン）の読み込み先
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm"
        );
        
        statusDiv.innerText = "骨格抽出モデルをロード中（数秒かかります）...";
        
        // 【修正】エラーの原因だったURLを、最も安定して取得できるCDNのURLに変更しました
        poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task",
            delegate: "CPU"
          },
          runningMode: "VIDEO",
          numPoses: 1
        });
        
        statusDiv.innerText = "カメラを起動しています...";
        startCamera();
      } catch (error) {
        statusDiv.innerText = "エラー発生: " + error.message;
        console.error(error);
      }
    }

    async function startCamera() {
      try {
        const constraints = {
          video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } }
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        
        video.addEventListener("loadeddata", () => {
          statusDiv.innerText = "AI動作中！体を映してください";
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          predictLoop();
        });
      } catch (error) {
        statusDiv.innerText = "カメラ起動エラー。カメラのアクセス権を許可してください。";
      }
    }

    function predictLoop() {
      if (!poseLandmarker) return;
      
      const startTimeMs = performance.now();
      const results = poseLandmarker.detectForVideo(video, startTimeMs);
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      if (results.landmarks && results.landmarks.length > 0) {
        const landmarks = results.landmarks[0];
        
        // 関節の点を青色で描画
        landmarks.forEach(landmark => {
          ctx.beginPath();
          ctx.arc(landmark.x * canvas.width, landmark.y * canvas.height, 6, 0, 2 * Math.PI);
          ctx.fillStyle = "#007aff"; 
          ctx.fill();
          ctx.strokeStyle = "white";
          ctx.lineWidth = 2;
          ctx.stroke();
        });
      }
      requestAnimationFrame(predictLoop);
    }

    // 起動
    initializeAI();
  </script>
</body>
</html>
