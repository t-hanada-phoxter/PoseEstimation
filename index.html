<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>姿勢AI分析</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4fb;
      color: #222;
      min-height: 100dvh;
    }

    /* ── スクリーン管理 ── */
    .screen { display: none; flex-direction: column; min-height: 100dvh; }
    .screen.active { display: flex; }

    /* ── ローディング ── */
    #loadingScreen { justify-content: center; align-items: center; gap: 20px; background: #fff; }
    #loadingLogo { width: 120px; height: auto; }
    .spinner {
      width: 52px; height: 52px;
      border: 4px solid rgba(0,0,0,0.1);
      border-top-color: #1976d2;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingStatus { font-size: 0.95rem; color: #666; text-align: center; padding: 0 24px; }

    /* ── カメラ画面 ── */
    #cameraScreen {
      background: #f0f4fb;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* タイトルバー */
    .mode-banner {
      padding: 11px 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      letter-spacing: 0.03em;
      background: #fff;
      border-bottom: 2px solid;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .mode-banner.before { color: #1565c0; border-color: #1565c0; }
    .mode-banner.after  { color: #2e7d32; border-color: #2e7d32; }
    .banner-logo { width: 28px; height: 28px; object-fit: contain; border-radius: 4px; }

    /* 計測モードタブ */
    #viewTabs {
      display: flex;
      background: #fff;
      border-bottom: 1px solid #e0e6f0;
    }
    .tab-btn {
      flex: 1;
      padding: 9px 4px 7px;
      border: none;
      background: none;
      font-size: 0.8rem;
      font-weight: bold;
      color: #999;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn.active           { color: #1565c0; border-bottom-color: #1565c0; }
    .tab-btn.locked           { color: #bbb; cursor: default; }
    .tab-btn.active.view-side { color: #6a1b9a; border-bottom-color: #6a1b9a; }
    .tab-btn.active.view-dyn  { color: #e65100; border-bottom-color: #e65100; }

    /* 映像エリア */
    #videoContainer {
      position: relative;
      margin: 10px 12px;
      flex: 1;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    #overlayCanvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    /* 計測値パネル */
    #metricsPanel {
      background: #fff;
      border-top: 1px solid #e0e6f0;
      padding: 10px 12px;
      display: grid;
      gap: 6px;
    }
    .metric-item { text-align: center; }
    .metric-label { font-size: 0.6rem; color: #888; margin-bottom: 2px; }
    .metric-value { font-size: 1.1rem; font-weight: bold; }
    .good    { color: #388e3c; }
    .warn    { color: #e65100; }
    .bad     { color: #c62828; }
    .neutral { color: #333; }

    #captureBtn {
      margin: 12px 16px 14px;
      padding: 15px;
      border-radius: 50px;
      border: none;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    #captureBtn:active { opacity: 0.75; }
    #captureBtn.before { background: #1976d2; color: #fff; }
    #captureBtn.after  { background: #388e3c; color: #fff; }

    /* ── 比較レポート画面 ── */
    #comparisonScreen { padding: 16px; gap: 16px; overflow-y: auto; }

    .comp-header { text-align: center; }
    .comp-header h2 { font-size: 1.25rem; font-weight: bold; }
    .comp-header p  { font-size: 0.8rem; color: #888; margin-top: 4px; }

    .image-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .capture-card { text-align: center; }
    .capture-card img { width: 100%; border-radius: 8px; display: block; }
    .capture-label {
      font-size: 0.8rem; font-weight: bold;
      margin-top: 6px; padding: 4px 8px; border-radius: 4px; display: inline-block;
    }
    .before-label { background: #1565c0; color: #fff; }
    .after-label  { background: #2e7d32; color: #fff; }

    .score-card {
      background: rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
    }
    .score-card .sub  { font-size: 0.82rem; color: #888; margin-bottom: 6px; }
    .score-number { font-size: 3rem; font-weight: bold; line-height: 1; }
    .score-note   { font-size: 0.85rem; margin-top: 6px; color: #ccc; }
    .improved { color: #81c784; }
    .worsened { color: #e57373; }
    .unchanged { color: #fff; }

    .metrics-table { background: rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden; }
    .tbl-head {
      display: grid; grid-template-columns: 2fr 1fr 1fr 1fr;
      padding: 9px 12px;
      background: rgba(255,255,255,0.08);
      font-size: 0.7rem; color: #888; font-weight: bold;
    }
    .tbl-row {
      display: grid; grid-template-columns: 2fr 1fr 1fr 1fr;
      padding: 10px 12px;
      border-top: 1px solid rgba(255,255,255,0.07);
      font-size: 0.82rem; align-items: center;
    }
    .tbl-row div { text-align: center; }
    .tbl-row div:first-child { text-align: left; font-size: 0.78rem; color: #ccc; }
    .delta-pos { color: #81c784; font-weight: bold; }
    .delta-neg { color: #e57373; font-weight: bold; }

    .reset-btn {
      padding: 15px; border-radius: 50px; border: none;
      font-size: 0.95rem; font-weight: bold; cursor: pointer;
      background: rgba(255,255,255,0.12); color: #fff; width: 100%;
    }
    .reset-btn:active { opacity: 0.75; }
  </style>
</head>
<body>

  <!-- ローディング -->
  <div id="loadingScreen" class="screen active">
    <img id="loadingLogo" src="miya.png" alt="ロゴ">
    <div class="spinner"></div>
    <div id="loadingStatus">AIシステムを起動しています...</div>
  </div>

  <!-- カメラ画面 -->
  <div id="cameraScreen" class="screen">
    <div id="modeBanner" class="mode-banner before">
      <img src="miya.png" class="banner-logo" alt="">治療前の姿勢を撮影してください
    </div>
    <!-- 計測モード切替タブ -->
    <div id="viewTabs">
      <button class="tab-btn active" data-view="front">正面</button>
      <button class="tab-btn" data-view="side">横向き</button>
      <button class="tab-btn" data-view="dynamic">動的</button>
    </div>
    <div id="videoContainer">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="overlayCanvas"></canvas>
    </div>
    <div id="metricsPanel"></div>
    <button id="captureBtn" class="before">治療前を保存する</button>
  </div>

  <!-- 比較レポート -->
  <div id="comparisonScreen" class="screen">
    <div class="comp-header">
      <h2>姿勢改善レポート</h2>
      <p id="compModeLabel">治療前後の姿勢データを比較しています</p>
    </div>

    <div class="image-row">
      <div class="capture-card">
        <img id="beforeImg" alt="治療前">
        <div class="capture-label before-label">治療前</div>
      </div>
      <div class="capture-card">
        <img id="afterImg" alt="治療後">
        <div class="capture-label after-label">治療後</div>
      </div>
    </div>

    <div class="score-card">
      <div class="sub">総合改善スコア</div>
      <div class="score-number" id="totalScore">--</div>
      <div class="score-note" id="scoreNote"></div>
    </div>

    <div class="metrics-table">
      <div class="tbl-head">
        <div>指標</div>
        <div>治療前</div>
        <div>治療後</div>
        <div>変化</div>
      </div>
      <div id="metricsTableBody"></div>
    </div>

    <button class="reset-btn" id="resetBtn">🔄 もう一度測定する</button>
  </div>

  <script type="module">
    import { PoseLandmarker, FilesetResolver } from
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8";

    // ── 指標定義 ─────────────────────────────────────────────
    // higher: 大きいほど良い / good,warn: 閾値（higherの場合は下限、!higherの場合は絶対値上限）
    const METRIC_DEFS = {
      // 正面
      headForward: { label: '頭部前傾角',   unit: '°',  higher: true,  signed: false, good: 160, warn: 140 },
      trunk:       { label: '体幹傾斜角',   unit: '°',  higher: false, signed: false, good: 5,   warn: 15  },
      shoulder:    { label: '肩の水平差',   unit: '%',  higher: false, signed: true,  good: 3,   warn: 6   },
      pelvis:      { label: '骨盤の水平差', unit: '%',  higher: false, signed: true,  good: 3,   warn: 6   },
      headTilt:    { label: '頭部傾斜角',   unit: '°',  higher: false, signed: true,  good: 2,   warn: 5   },
      trunkShift:  { label: '体幹側方傾斜', unit: '%',  higher: false, signed: true,  good: 3,   warn: 8   },
      // 横向き
      pelvisTilt:  { label: '骨盤傾斜角',   unit: '°',  higher: false, signed: true,  good: 5,   warn: 15  },
      earDev:      { label: '耳の垂線ズレ', unit: '%',  higher: false, signed: true,  good: 5,   warn: 15  },
      shoDev:      { label: '肩の垂線ズレ', unit: '%',  higher: false, signed: true,  good: 5,   warn: 15  },
      kneeAngle:   { label: '膝関節角',     unit: '°',  higher: true,  signed: false, good: 170, warn: 150 },
      // 動的
      swayX:       { label: '左右の揺らぎ', unit: '',   higher: false, signed: false, good: 2,   warn: 5   },
      swayY:       { label: '前後の揺らぎ', unit: '',   higher: false, signed: false, good: 2,   warn: 5   },
      stability:   { label: '安定性',       unit: 'pt', higher: true,  signed: false, good: 80,  warn: 60  },
    };

    // パネル表示キー／比較テーブルキー
    const VIEW_MODES = {
      front:   {
        label:  '正面（前額面）',
        hint:   '正面から撮影してください',
        panel:  ['shoulder', 'pelvis', 'headTilt'],
        table:  ['headForward', 'trunk', 'shoulder', 'pelvis', 'headTilt', 'trunkShift'],
      },
      side:    {
        label:  '横向き（矢状面）',
        hint:   '真横から撮影してください',
        panel:  ['pelvisTilt', 'earDev', 'kneeAngle'],
        table:  ['pelvisTilt', 'earDev', 'shoDev', 'kneeAngle'],
      },
      dynamic: {
        label:  '動的（安定性）',
        hint:   '10秒間静止して立ってください',
        panel:  ['swayX', 'swayY', 'stability'],
        table:  ['swayX', 'swayY', 'stability'],
      },
    };

    // ── 状態 ────────────────────────────────────────────────
    let poseLandmarker  = null;
    let mode            = 'before';      // 治療前 / 治療後
    let viewMode        = 'front';       // front / side / dynamic
    let beforeData      = null;
    let afterData       = null;
    let currentMetrics  = null;
    let animFrameId     = null;
    let metricsBuffer   = [];
    let frameCount      = 0;
    let swayHistory     = [];            // 動的モード用：鼻の座標履歴

    // ── DOM ─────────────────────────────────────────────────
    const video         = document.getElementById('webcam');
    const canvas        = document.getElementById('overlayCanvas');
    const ctx           = canvas.getContext('2d');
    const loadingStatus = document.getElementById('loadingStatus');
    const modeBanner    = document.getElementById('modeBanner');
    const captureBtn    = document.getElementById('captureBtn');
    const metricsPanel  = document.getElementById('metricsPanel');

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // ── スケルトン接続定義 ──────────────────────────────────
    const CONNECTIONS = [
      [11,12],[11,23],[12,24],[23,24],
      [11,13],[13,15],[12,14],[14,16],
      [23,25],[25,27],[24,26],[26,28],
      [7,11],[8,12],[0,11],[0,12],
    ];

    // ── ユーティリティ ───────────────────────────────────────
    function angleDeg(a, b, c) {
      const ba = { x: a.x - b.x, y: a.y - b.y };
      const bc = { x: c.x - b.x, y: c.y - b.y };
      const dot = ba.x * bc.x + ba.y * bc.y;
      const mag = Math.hypot(ba.x, ba.y) * Math.hypot(bc.x, bc.y);
      if (mag === 0) return 0;
      return Math.acos(Math.min(1, Math.max(-1, dot / mag))) * 180 / Math.PI;
    }

    function mid(a, b) {
      return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }

    // ── 指標計算（モード別） ─────────────────────────────────
    function calcMetrics(lm) {
      if (viewMode === 'front')   return calcFront(lm);
      if (viewMode === 'side')    return calcSide(lm);
      return calcDynamic(lm);
    }

    function calcFront(lm) {
      const lEar = lm[7], rEar = lm[8];
      const lSho = lm[11], rSho = lm[12];
      const lHip = lm[23], rHip = lm[24];
      const lAnk = lm[27], rAnk = lm[28];

      const earMid   = mid(lEar, rEar);
      const shoMid   = mid(lSho, rSho);
      const hipMid   = mid(lHip, rHip);
      const ankMid   = mid(lAnk, rAnk);
      const bodyH    = Math.hypot(shoMid.x - hipMid.x, shoMid.y - hipMid.y);
      if (bodyH < 0.01) return null;

      // 頭部前傾角: 耳中→肩中→腰中（180°が理想）
      const headForward = Math.round(angleDeg(earMid, shoMid, hipMid));
      // 体幹傾斜角: 垂直vs肩中→腰中（0°が理想）
      const trunk       = Math.round(angleDeg({ x: shoMid.x, y: shoMid.y - 1 }, shoMid, hipMid));
      // 肩の水平差: +＝左肩が高い、−＝右肩が高い
      const shoulder    = Math.round((rSho.y - lSho.y) / bodyH * 100);
      // 骨盤の水平差: +＝左骨盤が高い
      const pelvis      = Math.round((rHip.y - lHip.y) / bodyH * 100);
      // 頭部傾斜角: 耳ラインの水平からの傾き
      const headTilt    = Math.round(Math.atan2(rEar.y - lEar.y, rEar.x - lEar.x) * 180 / Math.PI);
      // 体幹側方傾斜: 肩中心vs足中心の水平ズレ（+＝右寄り）
      const trunkShift  = Math.round((shoMid.x - ankMid.x) / bodyH * 100);

      return { headForward, trunk, shoulder, pelvis, headTilt, trunkShift };
    }

    function calcSide(lm) {
      const lEar = lm[7], rEar = lm[8];
      const lSho = lm[11], rSho = lm[12];
      const lHip = lm[23], rHip = lm[24];
      const lKne = lm[25], rKne = lm[26];
      const lAnk = lm[27], rAnk = lm[28];

      const earMid  = mid(lEar, rEar);
      const shoMid  = mid(lSho, rSho);
      const hipMid  = mid(lHip, rHip);
      const kneMid  = mid(lKne, rKne);
      const ankMid  = mid(lAnk, rAnk);
      const bodyLen = Math.hypot(earMid.x - ankMid.x, earMid.y - ankMid.y);
      if (bodyLen < 0.05) return null;

      // 骨盤傾斜角: 腰→膝ラインの垂直からのズレ（+＝前傾/反り腰、−＝後傾/猫背）
      const pelvisTilt = Math.round(
        Math.atan2(kneMid.x - hipMid.x, hipMid.y - kneMid.y) * 180 / Math.PI
      );
      // 耳・肩の垂線ズレ: 足首を基準とした水平方向のズレ（%）
      const earDev = Math.round((earMid.x - ankMid.x) / bodyLen * 100);
      const shoDev = Math.round((shoMid.x - ankMid.x) / bodyLen * 100);
      // 膝関節角: 腰→膝→足首（180°＝完全伸展が理想）
      const lKA = angleDeg(lHip, lKne, lAnk);
      const rKA = angleDeg(rHip, rKne, rAnk);
      const kneeAngle = Math.round((lKA + rKA) / 2);

      return { pelvisTilt, earDev, shoDev, kneeAngle };
    }

    function calcDynamic(lm) {
      const nose = lm[0];
      swayHistory.push({ x: nose.x, y: nose.y });
      if (swayHistory.length > 90) swayHistory.shift(); // 約3秒分
      if (swayHistory.length < 10) return null;

      const n  = swayHistory.length;
      const mX = swayHistory.reduce((s, p) => s + p.x, 0) / n;
      const mY = swayHistory.reduce((s, p) => s + p.y, 0) / n;
      const swayX = Math.round(Math.sqrt(swayHistory.reduce((s, p) => s + (p.x - mX) ** 2, 0) / n) * 1000);
      const swayY = Math.round(Math.sqrt(swayHistory.reduce((s, p) => s + (p.y - mY) ** 2, 0) / n) * 1000);
      const stability = Math.max(0, Math.round((1 - Math.hypot(swayX, swayY) / 15) * 100));

      return { swayX, swayY, stability };
    }

    // ── スコア計算（モード別） ───────────────────────────────
    function calcScore(m, vm) {
      const c = v => Math.max(0, Math.min(100, v));
      if (vm === 'front') {
        return Math.round(
          c((m.headForward - 120) / 60 * 100) * 0.2 +
          c((1 - m.trunk / 30) * 100)         * 0.2 +
          c((1 - Math.abs(m.shoulder)  / 10) * 100) * 0.2 +
          c((1 - Math.abs(m.pelvis)    / 10) * 100) * 0.2 +
          c((1 - Math.abs(m.headTilt)  / 10) * 100) * 0.1 +
          c((1 - Math.abs(m.trunkShift)/ 10) * 100) * 0.1
        );
      }
      if (vm === 'side') {
        return Math.round(
          c((1 - Math.abs(m.pelvisTilt) / 30) * 100) * 0.35 +
          c((1 - Math.abs(m.earDev)     / 20) * 100) * 0.30 +
          c((1 - Math.abs(m.shoDev)     / 20) * 100) * 0.15 +
          c((1 - Math.abs(180 - m.kneeAngle) / 30) * 100) * 0.20
        );
      }
      return m.stability; // dynamic
    }

    // ── パネルUI ─────────────────────────────────────────────
    function renderMetricsPanel() {
      const keys = VIEW_MODES[viewMode].panel;
      metricsPanel.style.gridTemplateColumns = `repeat(${keys.length}, 1fr)`;
      metricsPanel.innerHTML = keys.map(key => {
        const def = METRIC_DEFS[key];
        return `<div class="metric-item">
          <div class="metric-label">${def.label}</div>
          <div class="metric-value neutral" id="m-${key}">--</div>
        </div>`;
      }).join('');
    }

    function metricColor(key, value) {
      const def = METRIC_DEFS[key];
      const abs = Math.abs(value);
      if (def.higher) return value >= def.good ? 'good' : value >= def.warn ? 'warn' : 'bad';
      return abs <= def.good ? 'good' : abs <= def.warn ? 'warn' : 'bad';
    }

    function metricFmt(key, value) {
      const def = METRIC_DEFS[key];
      return (def.signed && value > 0 ? '+' : '') + value + def.unit;
    }

    function updateMetricsUI(m) {
      VIEW_MODES[viewMode].panel.forEach(key => {
        const el = document.getElementById('m-' + key);
        if (!el || m[key] === undefined) return;
        el.textContent  = metricFmt(key, m[key]);
        el.className    = 'metric-value ' + metricColor(key, m[key]);
      });
    }

    function clearMetricsUI() {
      document.querySelectorAll('.metric-value').forEach(el => {
        el.textContent = '--';
        el.className   = 'metric-value neutral';
      });
    }

    // ── スケルトン描画 ───────────────────────────────────────
    function drawSkeleton(lm) {
      const W = canvas.width, H = canvas.height;
      ctx.lineWidth   = 2.5;
      ctx.strokeStyle = 'rgba(79,195,247,0.85)';
      CONNECTIONS.forEach(([i, j]) => {
        if (!lm[i] || !lm[j]) return;
        ctx.beginPath();
        ctx.moveTo(lm[i].x * W, lm[i].y * H);
        ctx.lineTo(lm[j].x * W, lm[j].y * H);
        ctx.stroke();
      });
      lm.forEach(lmk => {
        ctx.beginPath();
        ctx.arc(lmk.x * W, lmk.y * H, 4.5, 0, Math.PI * 2);
        ctx.fillStyle   = '#fff';
        ctx.fill();
        ctx.strokeStyle = '#4fc3f7';
        ctx.lineWidth   = 2;
        ctx.stroke();
      });
    }

    // ── 推定ループ ───────────────────────────────────────────
    function predictLoop() {
      if (!poseLandmarker) return;
      const results = poseLandmarker.detectForVideo(video, performance.now());
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (results.landmarks?.length > 0) {
        const lm = results.landmarks[0];
        drawSkeleton(lm);
        const m = calcMetrics(lm);
        if (m) {
          currentMetrics = m;
          metricsBuffer.push(m);
          frameCount++;
          if (frameCount % 4 === 0) {
            const keys = Object.keys(metricsBuffer[0]);
            const avg  = {};
            keys.forEach(k => {
              avg[k] = Math.round(metricsBuffer.reduce((s, v) => s + v[k], 0) / metricsBuffer.length);
            });
            metricsBuffer = [];
            updateMetricsUI(avg);
          }
        }
      } else {
        currentMetrics = null;
        metricsBuffer  = [];
        swayHistory    = [];
        clearMetricsUI();
      }

      animFrameId = requestAnimationFrame(predictLoop);
    }

    // ── スナップショット ─────────────────────────────────────
    function captureSnapshot() {
      const tmp    = document.createElement('canvas');
      tmp.width    = canvas.width;
      tmp.height   = canvas.height;
      const tmpCtx = tmp.getContext('2d');
      tmpCtx.drawImage(video,  0, 0, tmp.width, tmp.height);
      tmpCtx.drawImage(canvas, 0, 0);
      return {
        imageUrl: tmp.toDataURL('image/jpeg', 0.82),
        metrics:  { ...currentMetrics },
        score:    calcScore(currentMetrics, viewMode),
        viewMode,
      };
    }

    // ── 比較レポート ─────────────────────────────────────────
    function showComparison() {
      cancelAnimationFrame(animFrameId);

      document.getElementById('beforeImg').src = beforeData.imageUrl;
      document.getElementById('afterImg').src  = afterData.imageUrl;
      document.getElementById('compModeLabel').textContent =
        VIEW_MODES[beforeData.viewMode].label + ' の比較';

      const delta   = afterData.score - beforeData.score;
      const scoreEl = document.getElementById('totalScore');
      const noteEl  = document.getElementById('scoreNote');
      scoreEl.textContent = (delta >= 0 ? '+' : '') + delta + 'pt';
      scoreEl.className   = 'score-number ' + (delta > 0 ? 'improved' : delta < 0 ? 'worsened' : 'unchanged');
      noteEl.textContent  = delta > 0 ? '姿勢が改善されました！' : delta < 0 ? '姿勢スコアが低下しました。' : '変化はほぼ同じです。';

      const tableKeys = VIEW_MODES[beforeData.viewMode].table;
      document.getElementById('metricsTableBody').innerHTML = tableKeys.map(key => {
        const def = METRIC_DEFS[key];
        const bv  = beforeData.metrics[key];
        const av  = afterData.metrics[key];
        const d   = av - bv;
        const improved = def.signed
          ? Math.abs(av) < Math.abs(bv)
          : (def.higher ? d > 0 : d < 0);
        const cls = d === 0 ? '' : improved ? 'delta-pos' : 'delta-neg';
        return `<div class="tbl-row">
          <div>${def.label}</div>
          <div>${metricFmt(key, bv)}</div>
          <div>${metricFmt(key, av)}</div>
          <div class="${cls}">${(d > 0 ? '+' : '') + d + def.unit}</div>
        </div>`;
      }).join('');

      showScreen('comparisonScreen');
    }

    // ── タブ切替 ─────────────────────────────────────────────
    function setViewMode(vm) {
      viewMode      = vm;
      metricsBuffer = [];
      swayHistory   = [];
      currentMetrics = null;

      document.querySelectorAll('.tab-btn').forEach(btn => {
        const isActive = btn.dataset.view === vm;
        btn.classList.toggle('active', isActive);
        // タブ色クラス
        btn.classList.remove('view-side', 'view-dyn');
        if (isActive) {
          if (vm === 'side')    btn.classList.add('view-side');
          if (vm === 'dynamic') btn.classList.add('view-dyn');
        }
      });
      renderMetricsPanel();
    }

    document.getElementById('viewTabs').addEventListener('click', e => {
      const btn = e.target.closest('.tab-btn');
      if (!btn || btn.classList.contains('locked')) return;
      setViewMode(btn.dataset.view);
    });

    // ── カメラ起動 ───────────────────────────────────────────
    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
      });
      video.srcObject = stream;
      await new Promise(resolve => video.addEventListener('loadeddata', resolve, { once: true }));
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
    }

    // ── 初期化 ───────────────────────────────────────────────
    async function init() {
      try {
        loadingStatus.textContent = '設定ファイルをダウンロード中...';
        const vision = await FilesetResolver.forVisionTasks(
          'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm'
        );
        loadingStatus.textContent = '骨格抽出モデルをロード中（数秒かかります）...';
        poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task',
            delegate: 'CPU'
          },
          runningMode: 'VIDEO',
          numPoses: 1
        });
        loadingStatus.textContent = 'カメラを起動しています...';
        await startCamera();
        renderMetricsPanel();
        showScreen('cameraScreen');
        predictLoop();
      } catch (err) {
        loadingStatus.textContent = 'エラー発生: ' + err.message;
        console.error(err);
      }
    }

    // ── イベント ─────────────────────────────────────────────
    captureBtn.addEventListener('click', () => {
      if (!currentMetrics) {
        alert('人体が検出されていません。カメラに全身を映してください。');
        return;
      }
      if (mode === 'before') {
        beforeData = captureSnapshot();
        mode       = 'after';
        // タブをロック（前後で異なるモードの比較を防ぐ）
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.add('locked'));
        modeBanner.innerHTML  = '<img src="miya.png" class="banner-logo" alt="">治療後の姿勢を撮影してください';
        modeBanner.className  = 'mode-banner after';
        captureBtn.textContent = '治療後を保存する';
        captureBtn.className   = 'after';
      } else {
        afterData = captureSnapshot();
        showComparison();
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      mode           = 'before';
      beforeData     = null;
      afterData      = null;
      metricsBuffer  = [];
      swayHistory    = [];
      currentMetrics = null;

      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('locked'));
      modeBanner.innerHTML   = '<img src="miya.png" class="banner-logo" alt="">治療前の姿勢を撮影してください';
      modeBanner.className   = 'mode-banner before';
      captureBtn.textContent = '治療前を保存する';
      captureBtn.className   = 'before';

      showScreen('cameraScreen');
      renderMetricsPanel();
      predictLoop();
    });

    init();
  </script>
</body>
</html>
