<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>整骨院 姿勢AI分析</title>
  
  <style>
    body { font-family: sans-serif; text-align: center; margin: 20px; background-color: #f0f2f5; }
    h1 { color: #333; font-size: 1.5rem; }
    #container { position: relative; width: 100%; max-width: 500px; margin: 0 auto; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    video, canvas { width: 100%; height: auto; display: block; }
    canvas { position: absolute; left: 0; top: 0; pointer-events: none; }
    #status { padding: 12px; background: #fff; margin-bottom: 15px; font-weight: bold; border-radius: 6px; border: 1px solid #ddd; }
  </style>
</head>
<body>

  <h1>姿勢推定（フロントエンド完結版）</h1>
  <div id="status">ライブラリをダウンロード中（10〜15秒かかる場合があります）...</div>
  
  <div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <script 
    id="mediapipe-script"
    src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/vision_bundle.js" 
    crossorigin="anonymous"
    onload="startSystem()"
  </script>

  <script>
    const video = document.getElementById("webcam");
    const canvas = document.getElementById("output_canvas");
    const ctx = canvas.getContext("2d");
    const statusDiv = document.getElementById("status");
    let poseLandmarker = undefined;

    // ① ライブラリの読み込みが「完全に終わったら」ここが実行される
    function startSystem() {
      statusDiv.innerText = "ライブラリ読み込み成功！AIを初期化中...";
      initializeAI();
    }

    async function initializeAI() {
      try {
        // window直下のオブジェクトをチェック
        const visionTasks = window.tasksVision || window.mpTasksVision;
        
        if (!visionTasks) {
          // 万が一認識できなかった場合の最終防衛策（直前でもう一度探す）
          statusDiv.innerText = "再確認中...";
          await new Promise(resolve => setTimeout(resolve, 1000)); // 1秒待つ
          return initializeAI();
        }

        statusDiv.innerText = "設定ファイルをロード中...";
        const vision = await visionTasks.FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm"
        );
        
        statusDiv.innerText = "骨格抽出AIを起動中...";
        poseLandmarker = await visionTasks.PoseLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numPoses: 1
        });
        
        statusDiv.innerText = "カメラを起動しています...";
        startCamera();
      } catch (error) {
        statusDiv.innerText = "エラー発生: " + error.message;
        console.error(error);
      }
    }

    async function startCamera() {
      try {
        const constraints = {
          video: { 
            facingMode: "environment", 
            width: { ideal: 640 }, 
            height: { ideal: 480 } 
          }
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        
        video.addEventListener("loadeddata", () => {
          statusDiv.innerText = "AI動作中！体を映してください";
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          predictLoop();
        });
      } catch (error) {
        statusDiv.innerText = "カメラ起動エラー。iPhoneの設定でSafariのカメラを許可してください。";
      }
    }

    function predictLoop() {
      if (!poseLandmarker) return;
      
      const startTimeMs = performance.now();
      const results = poseLandmarker.detectForVideo(video, startTimeMs);
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      if (results.landmarks && results.landmarks.length > 0) {
        const landmarks = results.landmarks[0];
        
        // 関節の点を青色で描画
        landmarks.forEach(landmark => {
          ctx.beginPath();
          ctx.arc(landmark.x * canvas.width, landmark.y * canvas.height, 6, 0, 2 * Math.PI);
          ctx.fillStyle = "#007aff"; 
          ctx.fill();
          ctx.strokeStyle = "white";
          ctx.lineWidth = 2;
          ctx.stroke();
        });
      }
      requestAnimationFrame(predictLoop);
    }

    // 最初のタイムアウト監視（万が一 onload がすり抜けた場合の保険）
    setTimeout(() => {
      const visionTasks = window.tasksVision || window.mpTasksVision;
      if (visionTasks && !poseLandmarker && statusDiv.innerText.includes("ダウンロード中")) {
        startSystem();
      }
    }, 3000);
  </script>
</body>
</html>
